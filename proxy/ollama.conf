# =============================================================================
#  ollama.conf — the model-server forwarder
# =============================================================================
#
#  WHAT THIS IS FOR
#  When you run `safer-opencode --ollama`, a small container starts from the
#  forwarder image (docker/Dockerfile.forwarder) and runs nginx with this
#  configuration. It is the only way the agent can reach a model server running
#  on your Mac.
#
#      ┌─ sealed network ──────────────────┐
#      │  ┌───────┐      ┌───────────────┐ │      ┌──────────────────┐
#      │  │ agent │ ───► │ this container│ │ ───► │ your Mac's       │
#      │  └───────┘      └───────────────┘ │      │ Ollama, port     │
#      │                 known as "ollama" │      │ 11434, only      │
#      └───────────────────────────────────┘      └──────────────────┘
#
#  WHY THIS IS NOT JUST A PIPE
#  The first version of this used socat, which copies bytes from one socket to
#  another and understands nothing about what it is copying. That was a mistake,
#  for a reason worth understanding.
#
#  Ollama's HTTP interface is not only "ask the model a question". It is also
#  the control panel for the daemon, with no password on it. Among other things
#  a client can ask it to:
#
#      /api/pull     download a model — FROM ANY REGISTRY HOST IT NAMES.
#                    A model name may be written  attacker.example.com/a/b ,
#                    so this one request makes your Mac open a connection to
#                    any address the caller chooses, with caller-chosen text in
#                    the path. That is a way out of the sandbox and a way to
#                    carry data with it, and none of it passes the gatekeeper.
#      /api/push     upload a model to a registry. The same thing, outbound.
#      /api/create   build a new model on the daemon from a description.
#      /api/delete   delete your models.
#      /api/blobs/…  upload arbitrary files into the daemon's store.
#
#  A dumb pipe hands all of that to the agent. So this container is not a pipe:
#  it is a filter that forwards inference requests and refuses everything else.
#
#  The map below is the whole policy. It works like the allowlist files next to
#  this one: a short list of what is permitted, and a default of "no" for
#  everything else.
#
#  WHAT THIS STILL DOES NOT SOLVE
#  If a model already on your Mac is a CLOUD model (a name ending in -cloud),
#  then asking it a question makes your Mac talk to ollama.com, outside this
#  sandbox and outside the allowlist. Nothing in this file can prevent that,
#  because from here it is an ordinary inference request. What this file does do
#  is stop the agent ADDING such a model: /api/pull is refused, and Ollama's
#  API does not download models on its own. So the set of reachable models is
#  frozen to whatever `ollama list` shows before you start.
#
#  So there are three answers to a cloud model, in increasing strength:
#  read the warning safer-opencode prints at startup, which names any -cloud
#  model you have installed; `ollama rm` those models; or run a second Ollama
#  daemon with its own OLLAMA_MODELS and no sign-in, where a cloud model cannot
#  resolve at all. The last is enforcement rather than policy, and it is the
#  only one that does not depend on somebody reading a warning.
#
#  __OLLAMA_PORT__ is replaced with the real port number by safer-opencode,
#  which mounts the result read-only. Do not put a port number here.
# =============================================================================


#  One worker is plenty: this forwards one developer's requests.
worker_processes 1;

#  Stay in the foreground. Docker stops a container when its main process ends,
#  so a server that put itself in the background would kill the container.
daemon off;

#  This container runs as a non-root user with a read-only filesystem, so
#  every path nginx writes to has to be inside the one writable place: /tmp.
pid /tmp/nginx.pid;

#  Errors and startup messages go to the container's error output, where
#  `docker logs` can collect them.
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    # -------------------------------------------------------------------------
    #  Writable paths
    # -------------------------------------------------------------------------
    #  nginx buffers large request and response bodies to disk. The default
    #  locations are not writable here, so move them all under /tmp. nginx
    #  creates these folders itself at startup.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    #  A prompt with a lot of code in it is a big request. The default limit of
    #  1 MB would reject it.
    client_max_body_size 512m;

    # -------------------------------------------------------------------------
    #  THE POLICY — which requests are inference, and which are administration
    # -------------------------------------------------------------------------
    #  `map` sets a variable by matching another one. Here: look at the request
    #  path and set $ollama_allowed to 1 or 0.
    #
    #  `default 0` first, so anything not named below is refused. A new Ollama
    #  endpoint added in a future version arrives refused rather than allowed,
    #  which is the safe direction to be wrong in.
    #
    #  $uri is the path AFTER nginx has decoded %xx escapes and resolved any
    #  "..", so a path dressed up to look harmless cannot slip through.
    #
    #  The ~ prefix means the pattern is a case-insensitive regular expression.
    map $uri $ollama_allowed {
        default 0;

        #  Ollama's own interface: ask a question, get an embedding, and read
        #  what is installed. None of these change anything on your Mac.
        ~*^/api/(chat|generate|embed|embeddings)$   1;
        ~*^/api/(tags|show|ps|version)$             1;

        #  The OpenAI-compatible interface at /v1. This is the one opencode
        #  uses when its config says  http://localhost:11434/v1 .
        ~*^/v1/(chat/completions|completions|embeddings|models)$   1;
        ~*^/v1/models/[^/]+$                                      1;
    }

    # -------------------------------------------------------------------------
    #  Recording refusals
    # -------------------------------------------------------------------------
    #  Successful inference is not logged — it is the normal case, and its
    #  paths are not interesting. Refusals ARE logged, so a blocked attempt
    #  shows up in connection_logs/ next to the ones the gatekeeper blocked.
    #
    #  Note what is logged: the method and the path only. Never the body, which
    #  is where the prompt and your code would be.
    #  allowed= and upstream= are here to tell two very different refusals
    #  apart. Without them both look identical in the log:
    #
    #      allowed=0                 THIS file refused the path. The map above
    #                                is the policy; the request never left.
    #      allowed=1 upstream=403    the map permitted it and YOUR MAC'S Ollama
    #                                refused it. Look at headers, not at policy.
    #
    #  The second case cost a debugging session once. It reads as "the sandbox
    #  blocked me" when the sandbox had allowed it.
    log_format ollama_denied '$time_iso8601 DENIED $request_method $uri '
                             'allowed=$ollama_allowed upstream=$upstream_status';

    #  `if=` makes a log line conditional on a variable being something other
    #  than empty or "0" — hence the map, which turns the status code into
    #  exactly that.
    map $status $ollama_log_this {
        default '';
        403     1;
    }
    access_log /dev/stdout ollama_denied if=$ollama_log_this;

    # -------------------------------------------------------------------------
    #  The single permitted destination
    # -------------------------------------------------------------------------
    #  host.docker.internal is your Mac, as seen from inside a container. The
    #  safer-opencode command passes --add-host so the name is guaranteed to
    #  exist.
    #  One host, one port: this container can reach nothing else on your Mac.
    upstream ollama_host {
        server host.docker.internal:__OLLAMA_PORT__;
    }

    server {
        #  The agent reaches this as  http://ollama:11434 . Ports above 1024
        #  do not need root, which is why this can run as a normal user.
        listen __OLLAMA_PORT__;
        server_name _;

        # ---------------------------------------------------------------------
        #  Settings shared by every forwarded request
        # ---------------------------------------------------------------------
        #  Ollama streams its answer back a token at a time. Without these
        #  three lines nginx would collect the whole answer before passing any
        #  of it on, and the agent would sit in silence and then receive
        #  everything at once.
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;

        #  A large local model can think for a long time before the first
        #  token. The default 60 seconds would cut it off.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 15s;

        # ---------------------------------------------------------------------
        #  THE HOST HEADER MUST SAY localhost
        # ---------------------------------------------------------------------
        #  Do not change this to  proxy_set_header Host $host;  which forwards
        #  the name the agent used — "ollama". That does not work, and the
        #  failure is confusing rather than obvious.
        #
        #  Ollama checks the Host header of every request and refuses one that
        #  does not name a loopback address. It is a guard against a web page
        #  in your browser driving the daemon on your machine. A reverse proxy
        #  in front of Ollama trips it, and Ollama answers 403. The agent sees
        #  a failed provider, and opencode reports
        #
        #      Error: Unexpected server error.
        #
        #  which names neither Ollama nor a header.
        #
        #  So tell the truth about the destination instead of about the route:
        #  from your Mac's point of view this request really is arriving at
        #  localhost on that port. The alternative is OLLAMA_ORIGINS on the
        #  daemon, which means changing settings on your Mac to suit the
        #  sandbox. One line here is better than that.
        proxy_set_header Host localhost:__OLLAMA_PORT__;

        #  Same guard, second door. Ollama also checks Origin when a request
        #  carries one. A command-line client normally sends none, and an empty
        #  value in nginx means "do not pass this header at all", so this
        #  removes the risk without adding anything.
        proxy_set_header Origin "";

        location / {
            #  The refusal. Everything not in the map above stops here.
            if ($ollama_allowed = 0) {
                return 403 "safer-opencode: this Ollama endpoint is not permitted\n";
            }

            #  Forward the DECODED path, not the raw one the agent sent. This
            #  matters: it means the request that reaches your Mac is the same
            #  path this file just checked, and not a differently-written
            #  version of it.
            proxy_pass http://ollama_host$uri$is_args$args;
        }
    }
}
