# =============================================================================
#  tinyproxy.conf — settings for the gatekeeper container
# =============================================================================
#
#  This file is mounted READ-ONLY into the gatekeeper container at
#  /etc/tinyproxy/tinyproxy.conf. Edit it here and re-run; no rebuild is needed.
#
#  ONE FILE, ALL THREE COMMANDS. safer-claude, safer-codex and safer-opencode
#  share this. Nothing in it is tool-specific — what differs between the tools
#  is the allowlist, not the proxy's settings.
#
#  Format: one "Directive Value" per line. Lines starting with # are comments.
#
#  The hosts the agent is allowed to reach are NOT in this file. They are in
#  allowlist-common.txt and allowlist-<tool>.txt next to it, which each command
#  joins into one file and mounts as /etc/tinyproxy/allowlist.txt.
# =============================================================================


# -----------------------------------------------------------------------------
#  Where to listen
# -----------------------------------------------------------------------------
#  0.0.0.0 means "every network interface in this container". That sounds
#  permissive, but the container is only reachable from the sealed network, and
#  the Allow rule further down restricts who may actually use the proxy.
Listen 0.0.0.0
Port 8888


# -----------------------------------------------------------------------------
#  Who may use the proxy
# -----------------------------------------------------------------------------
#  Without this, ANY container that can reach port 8888 could use the proxy to
#  get to the allowed hosts. This container is deliberately attached to a normal
#  Docker network as well (that is how it reaches the internet), so its
#  neighbours on that network could otherwise borrow it.
#
#  So: allow only the sealed networks' address range.
#
#  Why a /20 and not a /24: each run gets its own sealed network, so that two
#  sessions can run at the same time — safer-claude on one project and
#  safer-opencode on another. The ranges they pick from are the sixteen /24s in
#  SUBNET_POOL in lib/safer-common.sh, and 172.31.240.0/20 is exactly those
#  sixteen. If you change the pool, change this line to match.
Allow 172.31.240.0/20


# -----------------------------------------------------------------------------
#  The allowlist — this is the actual security control
# -----------------------------------------------------------------------------
#  FilterDefaultDeny Yes flips the meaning of the filter file. Normally a filter
#  file is a blocklist. With this set, it becomes an ALLOWLIST: anything that
#  does not match a line in the file is refused.
#
#  This is the single most important line in the file. Without it, the filter
#  file would be read as "block these two hosts, allow the entire internet".
FilterDefaultDeny Yes

#  The file holding the permitted hosts.
Filter "/etc/tinyproxy/allowlist.txt"

#  Treat the lines in that file as extended regular expressions, so patterns
#  can be anchored with ^ and $. See the comments in allowlist-common.txt for
#  why anchoring matters.
#
#  Note: this directive is documented as deprecated in favour of
#      FilterType ere
#  which does the same thing. It is deliberately NOT changed here. FilterType
#  arrived in tinyproxy 1.11, and an unknown directive stops tinyproxy from
#  starting at all — so on an older package this "tidy-up" would turn a
#  deprecation notice into a launch failure. Change it only after checking the
#  version in the image:
#      docker run --rm --pull=never safer-gatekeeper tinyproxy -v
FilterExtended On

#  WHY THERE IS NO PATH OR PAGE FILTERING HERE
#  tinyproxy can filter on whole URLs rather than domains (FilterURLs On), but
#  its own documentation says that works for plain HTTP only, not HTTPS. The
#  reason is not a missing feature: for an encrypted connection the proxy only
#  ever sees
#
#      CONNECT www.drupal.org:443 HTTP/1.1
#
#  and the path is inside the encrypted stream that opens after that line. So
#  the hostname is all there is to filter on. Allowing one page of a site and
#  not another would need the proxy to decrypt the traffic — which would also
#  mean it could read the prompts, the code and the credentials it currently
#  cannot. That trade is not worth making.
#
#  What to do instead: prefer a site's reference subdomain over one that mixes
#  documentation with text written by strangers. api.drupal.org and
#  www.drupal.org are the example — same project, very different content.

#  Hostnames are not case sensitive, so neither is the matching.
FilterCaseSensitive Off


# -----------------------------------------------------------------------------
#  Which ports may be tunnelled
# -----------------------------------------------------------------------------
#  When a client asks for an encrypted connection it sends
#  "CONNECT host:port". Listing ports here means only those are permitted.
#
#  443 is standard HTTPS. Without this restriction, an allowed hostname could
#  be used to tunnel to any port on that host — for example a database port or
#  an SSH port. One line closes that.
#
#  If you ever need plain HTTP tunnelling, add: ConnectPort 80
ConnectPort 443


# -----------------------------------------------------------------------------
#  Logging — tuned so that ONLY blocked connections are recorded
# -----------------------------------------------------------------------------
#  tinyproxy's log levels, from least to most detailed:
#
#      Critical  Error  Warning  Notice  Info  Connect
#
#  Setting a level records that level and everything to its LEFT.
#
#  Successful connections are logged at Info and Connect level. Refusals are
#  logged at Notice level. So "LogLevel Notice" records refusals and real
#  problems, and records NOTHING about connections that were allowed.
#
#  That is deliberate: the log is for deciding what to add to the allowlist, and
#  it keeps a record of blocked destinations without keeping a record of every
#  page the agent legitimately read.
LogLevel Notice

#  No LogFile directive on purpose. With no log file, tinyproxy writes to
#  standard output, which Docker captures. The command reads it with
#  `docker logs` when the session ends and saves it under connection_logs/ as
#  <tool>-<timestamp>.log.
#  Writing to a file inside the container would be pointless — the container's
#  filesystem is read-only and is thrown away when it stops.


# -----------------------------------------------------------------------------
#  Housekeeping
# -----------------------------------------------------------------------------
#  The container filesystem is read-only, so the process-id file must go in
#  /tmp, which the launching command provides as a small writable area in
#  memory.
PidFile "/tmp/tinyproxy.pid"

#  How long an idle connection is kept open, in seconds. These tools hold a
#  connection open while the model is producing a long answer, so this needs to
#  be generous. Too low and long responses get cut off.
Timeout 600

#  How many connections may be open at once. One agent needs a handful; 100 is
#  ample and costs nothing.
MaxClients 100

#  Do not add a "Via: tinyproxy" header to requests. It tells the destination
#  server about our setup and serves no purpose here.
DisableViaHeader Yes
